<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <linearGradient id="sunGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="chapelWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)" />

  <!-- Sun / Light Glow -->
  <circle cx="400" cy="180" r="160" fill="url(#sunGlow)" filter="blur(20px)" />

  <!-- Distant Mountains -->
  <path d="M0 380 L140 260 L280 340 L450 220 L620 330 L740 250 L800 310 L800 500 L0 500 Z" fill="#64748b" opacity="0.35" />
  <path d="M0 400 L180 300 L320 370 L520 280 L680 370 L800 290 L800 500 L0 500 Z" fill="#475569" opacity="0.5" />

  <!-- Ground Lawn -->
  <path d="M0 420 Q400 400 800 420 L800 500 L0 500 Z" fill="#15803d" />
  <path d="M0 440 Q400 420 800 440 L800 500 L0 500 Z" fill="#166534" />

  <!-- Chapel Main Building -->
  <!-- Main hall -->
  <rect x="250" y="300" width="300" height="140" fill="url(#chapelWall)" rx="4" />
  <!-- Main Roof -->
  <polygon points="230,300 400,210 570,300" fill="url(#roofGrad)" />

  <!-- Steeple Tower Base -->
  <rect x="365" y="190" width="70" height="110" fill="url(#chapelWall)" />
  <!-- Steeple Mid Tier -->
  <polygon points="360,190 400,120 440,190" fill="url(#roofGrad)" />
  <!-- Steeple Spire -->
  <polygon points="394,120 400,40 406,120" fill="#f8fafc" />
  <polygon points="398,40 400,20 402,40" fill="#facc15" />

  <!-- Entrance Portico -->
  <polygon points="340,360 400,320 460,360" fill="url(#roofGrad)" />
  <rect x="350" y="360" width="100" height="80" fill="#ffffff" />
  <!-- Double Doors -->
  <rect x="380" y="380" width="18" height="60" fill="#78350f" rx="2" />
  <rect x="402" y="380" width="18" height="60" fill="#78350f" rx="2" />
  <!-- Door windows / transoms -->
  <circle cx="389" cy="410" r="1.5" fill="#facc15" />
  <circle cx="411" cy="410" r="1.5" fill="#facc15" />

  <!-- Arched Windows Left -->
  <rect x="275" y="330" width="22" height="45" rx="11" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="2" />
  <rect x="310" y="330" width="22" height="45" rx="11" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="2" />

  <!-- Arched Windows Right -->
  <rect x="468" y="330" width="22" height="45" rx="11" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="2" />
  <rect x="503" y="330" width="22" height="45" rx="11" fill="url(#glassGrad)" stroke="#cbd5e1" stroke-width="2" />

  <!-- Center Stained Glass in Gable -->
  <circle cx="400" cy="270" r="18" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="2" />

  <!-- Trees & Landscaping -->
  <!-- Left Evergreen -->
  <polygon points="180,450 200,360 220,450" fill="#14532d" />
  <polygon points="185,420 200,340 215,420" fill="#15803d" />
  <polygon points="210,460 225,380 240,460" fill="#166534" />

  <!-- Right Evergreen -->
  <polygon points="560,460 575,370 590,460" fill="#166534" />
  <polygon points="585,450 605,350 625,450" fill="#14532d" />
  <polygon points="590,410 605,330 620,410" fill="#15803d" />

  <!-- Walkway -->
  <polygon points="370,440 430,440 470,500 330,500" fill="#e2e8f0" />
</svg>
